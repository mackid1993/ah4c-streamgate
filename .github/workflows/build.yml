name: build

# Deliberately does NOT build on every push to main. It runs only when you ask
# for it: push a v* tag, or start it by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  # Run it by hand from the Actions tab. Leave release_tag empty to just build
  # and get binaries as artifacts; set it (e.g. v0.1.2) to also cut a release.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish a release as (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false          # no go.sum; the cache step errors without one
      - run: go vet ./...
      - run: go build ./...

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: linux
            goarch: arm
            goarm: '7'
            suffix: linux-armv7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      # CGO off so the binary is static and runs in any container, including
      # the ah4c image, without a libc dependency.
      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          NAME="streamgate-${{ matrix.suffix }}"
          go build -trimpath -ldflags "-s -w" -o "$NAME" .
          sha256sum "$NAME" > "$NAME.sha256"
          ls -la "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: streamgate-${{ matrix.suffix }}
          path: streamgate-${{ matrix.suffix }}*
          if-no-files-found: error

  # Single job, runs only after every arch has built, so there is exactly one
  # writer to the release. Running this per-arch races and produces duplicate
  # releases with a partial set of assets.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list what will be published
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
