name: build

# Manual only. Nothing runs on pushes, tags or pull requests -- start it from
# the Actions tab. Leave release_tag empty to just check and build; set it
# (e.g. v0.1.6) to also publish a release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish a release as (leave empty to only build)'
        required: false
        default: ''

# Read by default; only the release job gets write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the module declares, and whatever is current. The gap
        # between them is where toolchain drift shows up.
        go: ['1.21', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false          # no go.sum; the cache step errors without one

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go build ./...

      # -race matters here specifically: stream() runs in a goroutine, talks to
      # main over two channels, and the tests swap the package-level stdoutW.
      # -count=1 so a re-run of an unchanged tree is not a cache hit.
      - run: go test -race -count=1 ./...

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: linux
            goarch: arm
            goarm: '7'
            suffix: linux-armv7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      # CGO off so the binary is static and runs in any container, including
      # the ah4c image, without a libc dependency.
      #
      # -X main.version stamps the build. Without it there is no way to answer
      # "which build are you running?", which is the first question about any
      # prebuilt binary.
      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          VERSION="${{ inputs.release_tag || github.sha }}"
          NAME="streamgate-${{ matrix.suffix }}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$NAME" .
          sha256sum "$NAME" > "$NAME.sha256"
          ls -la "$NAME"

      # The distribution model IS the prebuilt binary, so prove the shipped
      # artifact actually executes. amd64 runs natively on the runner.
      - name: smoke test
        if: matrix.suffix == 'linux-amd64'
        run: |
          ./streamgate-linux-amd64 --version
          ./streamgate-linux-amd64 --version 2>&1 | grep -q "streamgate "
          # No argument is a usage error, which must exit 2, not hang.
          set +e
          ./streamgate-linux-amd64; rc=$?
          set -e
          test "$rc" -eq 2 || { echo "bare invocation exited $rc, want 2"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: streamgate-${{ matrix.suffix }}
          path: streamgate-${{ matrix.suffix }}*
          if-no-files-found: error

  # Single job, runs only after every arch has built, so there is exactly one
  # writer to the release. Running this per-arch races and produces duplicate
  # releases with a partial set of assets.
  release:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksum manifest
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum $(ls streamgate-linux-* | grep -v '\.sha256$') > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
